# ccteam workflow.yaml — Team Sprint preset (V0.6.0 Wave 2 F114).
#
# Orchestrator-Worker pattern with multiple in-process teammates.
# Lead-session decomposes the brief, fans tasks out to N teammates,
# joins results. Best for "fix all X across repo" / "refactor module
# Y in 3 chunks" / parallel code work.
#
# Generated by ccteam-creator (preset: inproc-team).
# Persona: {{persona_label}}
name: {{workflow_slug}}
description: |
  Team Sprint — N in-process teammates working in parallel under the
  user's current session. Orchestrator-Worker pattern.

mode: agent-team

agent_team:
  team_name: {{workflow_slug}}
  lead_seed: |
    {{user_brief}}

    Decompose the task into {{worker_count}} parallel subtasks. Output
    a TEAM PLAN listing each teammate's role + spawn_brief, then STOP
    and wait for `go` / `yes` / `approve` before calling Task.

  teammate_mode: in-process
  cleanup_on_stop: ask-lead
  snapshot_path: .ccteam/team-snapshot.json
  auto_spawn_teammates: false

  suggested_teammates:
    - role: executor
      kind: definition
      spawn_brief: |
        Pick one of the decomposed subtasks the team-lead assigns to
        you. Apply edits, run tests, report results via SendMessage
        to team-lead.
    - role: critic
      kind: definition
      spawn_brief: |
        Review the executor teammates' output. Flag regressions, style
        drift, missed cases. Report via SendMessage to team-lead.

agents: {}
