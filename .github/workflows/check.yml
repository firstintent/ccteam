name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # v0.8 rmux G2 — real-daemon smoke. ccteam hosts the rmux daemon itself
  # (re-execs via `--__internal-daemon`), so no system `rmux` is needed —
  # only the built binary, pointed at by `RMUX_SDK_DAEMON_BINARY`. Linux
  # runners are PTY-capable; the test spawns `sh -c "echo ... && sleep"`,
  # so no claude/codex binary is required either. macOS/Windows deferred.
  rmux-smoke:
    name: rmux real-daemon smoke (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/rmux-smoke.sh
