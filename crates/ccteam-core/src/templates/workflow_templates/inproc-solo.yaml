# ccteam workflow.yaml — Solo Sidekick preset (V0.6.0 Wave 2 F114).
#
# Single in-process teammate spawned alongside the user's current
# Claude session. Use when you want one helper agent to work in
# parallel — e.g. "spawn a critic to review my edits". The lead
# (your session) drives task assignment via the native `Task` tool;
# this workflow exists mostly so `ccteam-creator` can ship a uniform
# `.ccteam/workflow.yaml` for every preset.
#
# Generated by ccteam-creator (preset: inproc-solo).
# Persona: {{persona_label}}
name: {{workflow_slug}}
description: |
  Solo Sidekick — one in-process teammate alongside the user's session.

mode: agent-team

agent_team:
  team_name: {{workflow_slug}}
  lead_seed: |
    {{user_brief}}

    Output a TEAM PLAN with one teammate (role: {{primary_role}}),
    then STOP and wait for `go` / `yes` / `approve` before calling Task.

  teammate_mode: in-process
  cleanup_on_stop: ask-lead
  snapshot_path: .ccteam/team-snapshot.json
  auto_spawn_teammates: false

  suggested_teammates:
    - role: {{primary_role}}
      kind: definition
      spawn_brief: |
        {{primary_brief}}

agents: {}
