[package]
name = "ccteam-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ccteam V0.3.2 web UI: React SPA + JSON API + WS PTY relay."
# V0.3.2 F53 — `build.rs` drives `npm run build` for the SPA bundle
# under `web/` and ensures `web/dist/` exists so `rust-embed` can pick
# the assets up at crate compile time. Gated by the `web-bundle`
# feature (default-on); disabling it skips npm entirely and falls back
# to a placeholder `index.html` so the rust-embed expansion still finds
# something to embed.
build = "build.rs"

[features]
# V0.3.2 F53 — when on (default), `build.rs` runs `npm install` +
# `npm run build` in `web/`. When off (`--no-default-features`),
# `build.rs` skips npm and writes a placeholder `web/dist/index.html`
# so rust-embed has a valid folder to embed.
default = ["web-bundle"]
web-bundle = []

[dependencies]
ccteam-core.workspace = true
# V0.6.1 F139 — share the hook dispatch with the CLI so `POST
# /internal/hook/...` runs the same code as `ccteam internal hook ...`.
ccteam-hooks.workspace = true
anyhow.workspace = true
chrono.workspace = true
# V0.5.0 F96 — resolve `~/.claude/` root (Anthropic Agent Teams SoT).
# `CCTEAM_CLAUDE_HOME` env override is the test seam so tempdirs can
# sandbox the entire teams data layer.
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
# V0.5.0 F96 — Agent Teams `.claude/agents/<agentType>.md` frontmatter
# parsing (Anthropic teammate definitions). `subagent_resolver` splits
# `--- yaml --- body` and feeds the front block through `serde_yaml`.
serde_yaml.workspace = true
serde_urlencoded = "0.7"
tokio.workspace = true
notify.workspace = true
tracing.workspace = true

# V0.3 M5.2 — SSE event push.
# `futures` provides Stream / StreamExt combinators (`flat_map`,
# `filter_map`) used by the SSE handlers to bridge the broadcast
# Receiver into an axum SSE response.
# `tokio-stream` exposes `BroadcastStream`, the canonical adapter
# from `tokio::sync::broadcast::Receiver` to `futures::Stream`.
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# V0.3 M5.0 — pinned per docs/versions/v0-3/prd.md §3.2.2.
# V0.3.2 F56 — enable `ws` feature so `axum::extract::ws::WebSocketUpgrade`
# is available for the PTY relay endpoints.
axum = { workspace = true, features = ["ws"] }
askama = { workspace = true }
# Constant-time token comparison (M5.3 token auth). Pulled in now so
# `ServeOpts` can carry the token-file knob without churning dep
# manifests when M5.3 lands.
subtle = { workspace = true }
# V0.3 M5.3 — auth middleware:
# - `axum-extra` provides the `CookieJar` extractor (not in axum 0.8
#   itself); the cookie shim sets a HttpOnly `ccteam_token` cookie so
#   browser GETs / SSE auto-include credentials after the first
#   `?token=ccteam:<...>` URL hit.
# - `rand` 0.8 generates the 32-byte token persisted at
#   `~/.ccteam/web-token` mode 0600.
axum-extra = { version = "0.10", features = ["cookie"] }
rand = "0.8"

# V0.3.2 F53 — embed the vite-built SPA bundle (`web/dist/`) into the
# binary so `ccteam web` ships the React UI without a separate static
# files step. Asset routes live in `routes/assets.rs`.
rust-embed = "8"
mime_guess = "2"

# V0.3.2 F56 — WS PTY relay backend.
# `futures-util` is promoted from dev-dep to runtime dep so the handler
# can use `SinkExt::send` + `StreamExt::next` on the split `WebSocket`.
# `nix` (signal feature) is kept available for the F57 follow-up which
# wires pause/resume into the PTY refcount semantics — F56 itself only
# refcounts subscribers and stops `tmux pipe-pane` on the last drop.
# `portable-pty` stays declared but unused in F56: F56 relays *tmux*
# pane bytes via `pipe-pane` + a FIFO, so we never own a PTY pair here.
# TODO(F57): use portable-pty if we ever spawn a private `tmux attach`
# for stdin routing instead of `tmux send-keys`.
portable-pty = "0.8"
futures-util = "0.3"
# `signal` keeps F57's planned SIGSTOP/SIGCONT path on the menu;
# `fs` is required for `nix::sys::stat::Mode` + `nix::unistd::mkfifo`
# (F56 uses these to create the FIFO under `~/.ccteam/pty/`).
nix = { version = "0.29", default-features = false, features = ["signal", "fs"] }

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true, features = ["json", "stream", "cookies"] }
# V0.3 M5.2 — SSE integration tests need to read the streaming body
# line by line. `tokio-util` exposes `StreamReader` (bytes stream →
# AsyncRead); `futures-util` provides the `StreamExt::map` adapter
# we use to bridge `reqwest::Error` → `std::io::Error`.
tokio-util = { version = "0.7", features = ["io"] }
# V0.3.2 F56 — WS PTY relay integration tests. `tokio-tungstenite` is
# the canonical async-tungstenite-on-tokio WS client; matches the
# version used by `axum::extract::ws` internally (tungstenite 0.24).
# `serial_test` serialises tmux-touching tests so concurrent
# session_name collisions can't happen even on `cargo test -j N`.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
serial_test = "3"
nix = { version = "0.29", default-features = false, features = ["signal", "process"] }
