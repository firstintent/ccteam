# OpenAI rate sheet — dollars per 1M tokens.
#
# Source: openai.com/api/pricing. The gpt-5.x family (current Codex
# models — gpt-5.5 default / gpt-5.4 / gpt-5.4-mini) verified 2026-06-24,
# cross-checked across two independent pricing mirrors. The legacy
# o3 / o3-mini / gpt-4o / gpt-4o-mini rows are retained for any older
# usage (verified 2026-05).
#
# Reasoning tokens (hidden CoT) are billed at the standard output rate,
# so `reasoning_per_1m == output_per_1m` for the reasoning models
# (gpt-5.x, o3, o3-mini). The gpt-4o family is not a reasoning model —
# `reasoning_per_1m` is omitted.
#
# Cached input discount (prompt cache hit): gpt-5.x cache_read is 10% of
# input ($0.50 / $0.25 / $0.075 for 5.5 / 5.4 / 5.4-mini); o3 75% off;
# o3-mini / gpt-4o / gpt-4o-mini 50% off.
#
# fallback_model = gpt-5.5 (the current Codex default) so an unknown or
# new Codex model id — e.g. gpt-5.3-codex-spark, which has no public
# price — estimates at the current flagship rather than the ancient o3.

schema_version = "2026-06-24"
fallback_model = "gpt-5.5"

[models."gpt-5.5"]
input_per_1m = 5.0
cached_input_per_1m = 0.5
output_per_1m = 30.0
reasoning_per_1m = 30.0

[models."gpt-5.4"]
input_per_1m = 2.5
cached_input_per_1m = 0.25
output_per_1m = 15.0
reasoning_per_1m = 15.0

[models."gpt-5.4-mini"]
input_per_1m = 0.75
cached_input_per_1m = 0.075
output_per_1m = 4.5
reasoning_per_1m = 4.5

[models."o3"]
input_per_1m = 2.0
cached_input_per_1m = 0.5
output_per_1m = 8.0
reasoning_per_1m = 8.0

[models."o3-mini"]
input_per_1m = 1.1
cached_input_per_1m = 0.55
output_per_1m = 4.4
reasoning_per_1m = 4.4

[models."gpt-4o"]
input_per_1m = 2.5
cached_input_per_1m = 1.25
output_per_1m = 10.0

[models."gpt-4o-mini"]
input_per_1m = 0.15
cached_input_per_1m = 0.075
output_per_1m = 0.6
