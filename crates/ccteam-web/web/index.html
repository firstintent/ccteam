<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>ccteam web</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#fafafb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- v0.8.24 — light is the product default (:root tokens). Apply the
         stored dark choice BEFORE first paint (no flash): only theme:"dark"
         adds html.dark; anything else stays light. -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("aoe-web-settings") || "{}");
        if (s.theme === "dark") document.documentElement.classList.add("dark");
      } catch (e) {
        /* default light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
