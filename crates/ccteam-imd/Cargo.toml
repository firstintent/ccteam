[package]
name = "ccteam-imd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "V0.6.0 Wave 2 F109/F116 — IM-bot daemon (Telegram / Slack / Discord) + per-bot tmux supervisor"

[[bin]]
name = "ccteam-imd"
path = "src/main.rs"

[dependencies]
# Trait + types only — no `crate::execution::*` direct dep (HarnessAdapter red line).
ccteam-core.workspace = true
# Cost tracking from progress events the daemon may surface.
ccteam-cost.workspace = true

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
futures.workspace = true
clap.workspace = true
chrono.workspace = true
dirs.workspace = true
notify.workspace = true
regex.workspace = true
# HTTP client for Telegram getUpdates + Slack chat.postMessage + Discord REST.
reqwest = { workspace = true, features = ["json"] }
# UNIX-only signalling for graceful supervisor SIGTERM (libc::kill).
libc = "0.2"

# V0.6.0 Wave 2 Option-C decision (docs/v0-6-0/wave-2-decisions.md §3):
# The Channel trait + slim TG/Slack/Discord providers live in-crate
# under src/transport/{traits,providers/*}.rs with reference attribution
# to references/openhuman/src/openhuman/channels/. We do NOT pull
# openhuman_core as a path dep (transitive: whisper-rs, tauri, AI libs)
# nor extract a separate ccteam-channels crate (ceremony for 3 providers
# we slim down anyway). Slack provider stays HTTP-only (no Socket Mode);
# Telegram uses long-polling getUpdates (no webhook server, no public
# URL needed for V0.6 host-probe scope).

[features]
# Each provider is a cargo feature; default = international "big three".
# China-platform names (lark/dingtalk/qq/wechat) are placeholder feature
# names — provider modules land in V0.7.
default = ["telegram", "slack", "discord"]
telegram = []
slack = []
discord = []
intl = ["telegram", "slack", "discord", "email", "irc"]
email = []
irc = []
china = ["lark", "dingtalk", "qq", "wechat"]
lark = []
dingtalk = []
qq = []
wechat = []
all = ["intl", "china", "signal", "imessage", "matrix", "whatsapp"]
signal = []
imessage = []
matrix = []
whatsapp = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
