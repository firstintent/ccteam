name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test (deterministic baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The deterministic baseline scope: workspace minus ccteam-web (its WS/PTY
      # tests need a real terminal), lib + bins targets only (tests/*.rs
      # integration files carry the env-flake families). Same scope as
      # `make test-baseline` — keep the two in sync.
      - run: cargo test --workspace --exclude ccteam-web --lib --bins --locked

  # The rmux real-daemon smoke (ubuntu + macOS matrix) used to run here.
  # The `terminal` protocol (tmux/rmux/PTY) is in maintenance-only mode and
  # planned for retirement — no new vendor or feature extends it — so paying
  # a multi-OS PTY smoke on every push/PR is not worth the wall-clock.
  # Run it by hand when touching the mux backend: `scripts/rmux-smoke.sh`.
