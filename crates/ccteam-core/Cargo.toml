[package]
name = "ccteam-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ccteam shared core: schemas, state/query helpers, project primitives, and hook schemas."

[dependencies]
# V0.6.0 Wave 1 — pricing / cost-level / budget moved out so dual-vendor
# (Anthropic + OpenAI) tables share one surface. ccteam-core re-exports
# UnifiedTokenUsage / estimate_cost / CostLevel from this crate for
# backward-compat with V0.5.x callers.
ccteam-cost.workspace = true

# V0.8 W1 — tmux CLI primitives moved into `ccteam-harness::tmux_ops` so
# the `ProcessBackend` trait + impls can live there without inducing a
# cargo cycle. `ccteam-core::tmux` is a thin re-export module on top.
ccteam-harness.workspace = true

serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
# V0.6.3 F142 — standard 5-field cron parsing for `trigger: schedule`.
croner.workspace = true
dirs.workspace = true
notify.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
regex.workspace = true
thiserror.workspace = true
# V0.6.0 F107 — async trait methods on HarnessAdapter + Codex-style
# event stream return on `events()`.
async-trait.workspace = true
futures.workspace = true

# v0.8.7 review-fix (R-M1) — OS CSPRNG for the per-session cto-gate secret
# (`session_secret::mint`). Direct dep so the secret never relies on a weak
# time-only token; already in the tree via `rand 0.8` so no new download.
getrandom.workspace = true

# V0.4.0 F61 — `libc::kill(pid, SIGTERM)` for ClaudeCodeAdapter's
# shutdown_session path. Replaces the V0.3.1 tmux `kill-session`
# flow now that ClaudeCodeAdapter no longer owns a tmux session.
libc = "0.2"

# V0.6.0 Wave 3 F112 §C — `~/.ccteam/preferences.toml` runtime parser
# + serializer (vendor fallback prefs). Promoted from dev-dependencies
# so `preferences::load` / `preferences::save` are available in non-test
# orchestrator code. `parse` + `display` features cover read + atomic
# write; pretty-print yields stable round-trippable output.
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
tempfile = "3"

# V0.4.0 F62 — codex-tests serialises tmux-touching integration tests
# so concurrent CodexAdapter spawn/shutdown checks don't race on the
# shared `tmux` server. Pinned to the same major as ccteam-web's
# dev-dependency for cargo dedup.
serial_test = "3"

# V0.6.8 F187 — tracing capture for `tail_marker_missing` WARN
# assertions. Uses the workspace pin (already in [workspace.dependencies]).
tracing-subscriber.workspace = true

# V0.6.0 Wave 2 F114 / Wave 3 F112 — `toml` is now a runtime dep
# (preferences.rs); persona_test.rs continues to use it via the
# runtime entry, no separate dev-dep needed.

[features]
default = ["test-util"]
# V0.4.0 F62 — gates CodexAdapter integration tests
# (`crates/ccteam-core/tests/codex_adapter_test.rs`). The tests require
# `tmux` on PATH and exercise the real `codex` CLI when present.
# Default feature set excludes them so CI without those binaries still
# passes; opt in with `cargo test --features codex-tests`.
codex-tests = []
# V0.4.0 F66 — exposes Orchestrator's `test_*` helper methods + the
# `Orchestrator::set_adapter` + ArtifactWatcher `test_sender` to crates
# outside the library (notably the integration test crate). The methods
# already exist behind `#[cfg(test)]` for in-crate unit tests; this
# feature lets `tests/orchestrator_thin_test.rs` (which compiles as a
# separate crate target) reach the same surface without a separate
# parallel implementation. Default-on so `cargo test --workspace`
# (without `--features` flags) picks up the F66 thin-orchestrator suite;
# the binary surface only adds methods prefixed with `test_` (plus
# `Orchestrator::set_adapter`), all of which are no-op in production
# code paths.
test-util = []
