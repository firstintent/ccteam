# ccteam workflow.yaml — IM Squad preset.
#
# Multi-bot chat workflow bound to an IM group. N bots in the same
# room, each addressable by `@<handle>`; bots can @ each other up to
# `hop_limit` deep for bot-to-bot collaboration. Human users in the
# group fire messages by @-mentioning a bot.
#
# Generated by ccteam-creator (preset: chat-squad).
# Bots: {{bot_handles_summary}}
# IM platform: {{im_platform}}
name: {{workflow_slug}}
description: |
  IM Squad — multiple bots in a {{im_platform}} group room with
  bot-to-bot @ addressing. Useful for "ask team" style consultations.

mode: chat

chat:
  bot_name: "{{primary_bot_handle}}"
  compact_every_turns: 30
  hop_limit: 3
  recover_last_n_turns: 12
  chat_acl:
    allow_groups:
      - "{{group_chat_id}}"

budget:
  max_cost_usd_per_24h: 20.00

agents:
{{agents_block}}
