[package]
name = "ccteam-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ccteam V0.3 web UI: read-only dashboard + write-action endpoints (axum + askama)."
# V0.3.2 F53 — `build.rs` drives `npm run build` for the SPA bundle
# under `web/` and ensures `web/dist/` exists so `rust-embed` can pick
# the assets up at crate compile time. Gated by the `web-bundle`
# feature (default-on); disabling it skips npm entirely and falls back
# to a placeholder `index.html` so the rust-embed expansion still finds
# something to embed.
build = "build.rs"

[features]
# V0.3.2 F53 — when on (default), `build.rs` runs `npm install` +
# `npm run build` in `web/`. When off (`--no-default-features`),
# `build.rs` skips npm and writes a placeholder `web/dist/index.html`
# so rust-embed has a valid folder to embed.
default = ["web-bundle"]
web-bundle = []

[dependencies]
ccteam-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
notify.workspace = true
tracing.workspace = true

# V0.3 M5.2 — SSE event push.
# `futures` provides Stream / StreamExt combinators (`flat_map`,
# `filter_map`) used by the SSE handlers to bridge the broadcast
# Receiver into an axum SSE response.
# `tokio-stream` exposes `BroadcastStream`, the canonical adapter
# from `tokio::sync::broadcast::Receiver` to `futures::Stream`.
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# V0.3 M5.0 — pinned per docs/v0-3/prd.md §3.2.2.
axum = { workspace = true }
askama = { workspace = true }
# Constant-time token comparison (M5.3 token auth). Pulled in now so
# `ServeOpts` can carry the token-file knob without churning dep
# manifests when M5.3 lands.
subtle = { workspace = true }
# V0.3 M5.3 — auth middleware:
# - `axum-extra` provides the `CookieJar` extractor (not in axum 0.8
#   itself); the cookie shim sets a HttpOnly `ccteam_token` cookie so
#   browser GETs / SSE auto-include credentials after the first
#   `?token=ccteam:<...>` URL hit.
# - `rand` 0.8 generates the 32-byte token persisted at
#   `~/.ccteam/web-token` mode 0600.
axum-extra = { version = "0.10", features = ["cookie"] }
rand = "0.8"

# V0.3.2 F53 — embed the vite-built SPA bundle (`web/dist/`) into the
# binary so `ccteam web` ships the React UI without a separate static
# files step. Asset routes live in `routes/assets.rs`.
rust-embed = "8"
mime_guess = "2"

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true, features = ["json", "stream", "cookies"] }
# V0.3 M5.2 — SSE integration tests need to read the streaming body
# line by line. `tokio-util` exposes `StreamReader` (bytes stream →
# AsyncRead); `futures-util` provides the `StreamExt::map` adapter
# we use to bridge `reqwest::Error` → `std::io::Error`.
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
