[package]
name = "ccteam-im"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "V0.6.0 Wave 2 F109/F116 — IM-bot daemon (Telegram / Slack / Discord) + per-bot tmux supervisor (V0.6.1 F130: library only; binary folded into `ccteam start`)"

# V0.6.1 F130 — `[[bin]]` removed. The IM supervisor loop runs inside
# `ccteam start` as one tokio task alongside the orchestrator and the
# embedded web UI, all sharing one shutdown channel. Library entry:
# `ccteam_im::run_daemon_with_shutdown`.

[dependencies]
# Primitives plus the current concrete adapter factories; execution moves
# out of core in the next P1 slice.
ccteam-core.workspace = true
# HarnessAdapter trait + cross-vendor thread/event types.
ccteam-harness.workspace = true
# Cost tracking from progress events the daemon may surface.
ccteam-cost.workspace = true

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
futures.workspace = true
clap.workspace = true
chrono.workspace = true
dirs.workspace = true
notify.workspace = true
regex.workspace = true
# tg-6955 — picker button label alignment (display-cell trim + tail padding).
unicode-width.workspace = true
# HTTP client for Telegram getUpdates + Slack chat.postMessage + Discord REST.
reqwest = { workspace = true, features = ["json", "multipart"] }
# v0.8.9 Phase 2 — sha256 integrity verification of ccteam-hub plugin bodies
# (`hub::fetch_plugin_body` checks the fetched body against the hub index's
# `content_sha`; `hub::installed_status` hashes on-disk bytes to detect an
# available update). Refuses a tampered body instead of writing it.
sha2.workspace = true
# UNIX-only signalling for graceful supervisor SIGTERM (libc::kill).
libc = "0.2"
# Lightweight WebSocket Channel used for local/browser IM e2e validation,
# plus the Lark/Feishu WSS long-connection. `rustls-tls-webpki-roots`
# adds the rustls TLS provider so `connect_async("wss://…")` works against
# real Feishu (matches the workspace `reqwest` rustls posture). Tests use
# plain-TCP localhost peers, so the feature is a runtime-only requirement.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# Lark/Feishu WS frame codec (pbbp2.proto) — used behind the `lark` feature.
prost.workspace = true

# V0.6.0 Wave 2 Option-C decision (docs/versions/v0-6-0/wave-2-decisions.md §3):
# The Channel trait + slim TG/Slack/Discord providers live in-crate
# under src/transport/{traits,providers/*}.rs with reference attribution
# to references/openhuman/src/openhuman/channels/. We do NOT pull
# openhuman_core as a path dep (transitive: whisper-rs, tauri, AI libs)
# nor extract a separate ccteam-channels crate (ceremony for 3 providers
# we slim down anyway). Slack provider stays HTTP-only (no Socket Mode);
# Telegram uses long-polling getUpdates (no webhook server, no public
# URL needed for V0.6 host-probe scope).

[features]
# Each provider is a cargo feature. `lark` (Feishu/Lark WS long-connection)
# ships in `default` so the gate (`cargo test`/`clippy` without `--features`)
# compiles + exercises the lark module and its tests. The remaining
# China-platform names (dingtalk/qq/wechat) stay placeholder feature names.
default = ["telegram", "slack", "discord", "lark"]
telegram = []
slack = []
discord = []
intl = ["telegram", "slack", "discord", "email", "irc"]
email = []
irc = []
china = ["lark", "dingtalk", "qq", "wechat"]
lark = []
dingtalk = []
qq = []
wechat = []
all = ["intl", "china", "signal", "imessage", "matrix", "whatsapp"]
signal = []
imessage = []
matrix = []
whatsapp = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
