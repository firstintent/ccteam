# ccteam workflow.yaml (V0.5.0 F93b — agent-team mode).
#
# This file declares the Agent Team that a ccteam-managed `__lead`
# Claude session bootstraps on `ccteam start <slug>`. Edit me to taste
# — at minimum, fill in `lead_seed` with the task you want the team
# to investigate.
#
# Two ways the lead picks teammates:
#   1. Read `agent_team.suggested_teammates` below (declarative)
#   2. Decide entirely from `lead_seed` (if `suggested_teammates` is empty)
#
# Either way, the lead first emits a TEAM PLAN and waits for your
# approval before calling `Task` to spawn teammates
# (`auto_spawn_teammates: false` is the default).
#
# Docs: docs/v0-5-0/prd.md §F93b, docs/orchestration-patterns.md §五
name: my-agent-team
description: |
  ccteam-managed Agent Team workflow. The `__lead` session reads
  `lead_seed` below as its first user-turn message, plans a team,
  waits for `go`/`yes`/`approve`, then spawns teammates via
  Anthropic's native `TeamCreate` + `Task` tools.

mode: agent-team

# Optional budget cap (F84). When `max_cost_usd_per_24h` trips,
# ccteam flips `enabled: false` + sends SIGTERM-then-SIGKILL to the
# lead (F93b `cleanup_on_stop: force-kill` cleanup).
# budget:
#   max_cost_usd_per_24h: 10.00

agent_team:
  # Must equal the Anthropic ~/.claude/teams/<team_name>/ dir name.
  team_name: my-agent-team

  # User-turn message written to the lead's stdin on spawn.
  # NOT a system prompt — the __lead.md spec is fixed across runs.
  lead_seed: |
    <describe the team's mission here>

    Suggested teammates are listed below (you may revise composition).
    Output a TEAM PLAN as your first message, then STOP and wait for
    user approval (`go` / `yes` / `approve`) before calling Task.

  # in-process | tmux | auto
  teammate_mode: in-process

  # MVP only supports force-kill on `ccteam stop <slug>`.
  cleanup_on_stop: force-kill

  # Snapshot path (relative to project root). workflow.yaml is parsed
  # once at spawn; the resolved spec is frozen to this file so
  # mid-flight workflow.yaml edits don't affect the running team.
  snapshot_path: .ccteam/team-snapshot.json

  # Default false — lead must wait for user approval before spawning
  # teammates (Plan-first Protocol). Set true ONLY if you want
  # autonomous spawn (an audit log is still written to
  # .ccteam/outbox/team-bootstrap-<ts>.md).
  auto_spawn_teammates: false

  # Optional declarative teammate suggestions. Empty list = lead
  # decides composition entirely from lead_seed.
  suggested_teammates:
    # ---- definition-backed teammate (preferred for cross-workflow reuse) ----
    # The role MUST have a corresponding .claude/agents/<role>.md file
    # somewhere in scope (project / user / plugin). Claude auto-appends
    # the .md body to the teammate's system prompt; this `spawn_brief`
    # only adds the per-task instructions.
    - role: code-reviewer
      kind: definition
      spawn_brief: |
        Review changes for security, performance, and maintainability.
        Report findings via SendMessage to team-lead.

    # ---- ad-hoc teammate (no .md file; entire prompt inlined) ----
    # The lead inlines a Worker Preamble + the `spawn_brief` and calls
    # Task(subagent_type: "general-purpose", model: ...). Best for
    # one-shot project-specific roles.
    # - role: db-expert
    #   kind: ad-hoc
    #   spawn_brief: |
    #     You are a PostgreSQL expert. Investigate slow query patterns
    #     in src/queries/. Report findings via SendMessage to team-lead.
    #   adhoc_model: sonnet
    #   adhoc_color: purple
    #   adhoc_tools: [Read, Grep, Bash]

# `agents:` map is empty in agent-team mode (the lead drives spawn
# at runtime via TeamCreate + Task). Schema validation allows this.
agents: {}
