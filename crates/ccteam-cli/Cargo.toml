[package]
name = "ccteam-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ccteam command-line tool: orchestrator daemon, project management, and hook subcommands."

[[bin]]
name = "ccteam"
path = "src/main.rs"

[dependencies]
ccteam-core.workspace = true
ccteam-flow.workspace = true
ccteam-hooks.workspace = true
ccteam-web.workspace = true
# V0.6.1 F130 — IM supervisor loop folded into `ccteam start` as one
# tokio task. The IM-transport transitive deps (`reqwest`) are accepted
# here because the operator-facing process model collapses to a single
# `ccteam start` daemon (orchestrator + web + IM supervisor).
ccteam-im.workspace = true
# V0.8 W1 — `interactive_attach_argv` for `ccteam attach` / `session
# attach`. The trait stays out of the sync CLI fns themselves; only
# the argv-builder is consumed here.
# V0.8 W5 — `backend_kind_from_env` to branch interactive attach +
# `from_env().capture(...)` for the rmux peek path.
ccteam-harness.workspace = true
# V0.8 W5 — interactive `ccteam attach` against the ccteam-hosted rmux
# daemon goes through rmux-client's public attach driver directly
# (Path A): `connect` → `Connection::begin_attach` → `into_parts` →
# `attach_terminal_with_initial_bytes`, which drives the local TTY in
# raw mode on the CLI's own controlling terminal. `rmux-proto` carries
# `SessionName` for `begin_attach`. Unix-only — Windows attach lands in
# a follow-up wave (the rmux backend is Unix-first).
[target.'cfg(unix)'.dependencies]
rmux-client.workspace = true
rmux-proto.workspace = true
clap.workspace = true
chrono.workspace = true
dirs.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
# v0.8.24 Track D — `ccteam host join|mint-token` HTTP client.
reqwest = { workspace = true, features = ["json"] }
# `web_chat_bridge` test server + `ccteam web` knob forwarding.
axum.workspace = true

# V0.6.0 Wave 3 F112 §C — `ccteam prefs show` pretty-prints the
# Preferences struct via `toml::to_string_pretty`. Aligned with the
# ccteam-core dep so cargo dedups.
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }

# V0.4.0-hotfix — `prctl(PR_SET_PDEATHSIG, SIGTERM)` so mcp-serve
# self-terminates when its parent (Claude Code MCP client) goes
# away. Without this, idle stdin doesn't surface EOF and the process
# accumulates. Linux-only; the wrapper is `#[cfg(target_os = "linux")]`
# no-op elsewhere.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# axum is a normal (non-dev) dependency now — see `[dependencies]` above.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# V0.6.6 F173 — `doctor_cost_orphan_test.rs` writes a project-registration
# `config.yaml` via the same serde_yaml the production loader uses.
serde_yaml.workspace = true
sha2.workspace = true
