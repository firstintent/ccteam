[package]
name = "ccteam-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ccteam mux abstraction — ProcessBackend trait + tmux/inproc impls. V0.8 W1 wraps the existing tmux CLI; V0.8 W2+ adds RmuxBackend."

[dependencies]
# V0.8 W0 — rmux is the future unified-mux execution surface. Trait
# definitions land in W1; the SDK + transport are pinned so semver
# drift is caught by `rmux_types_compile_link`.
rmux-sdk = { workspace = true }
rmux-client = { workspace = true }
rmux-server = { workspace = true }
rmux-proto = { workspace = true }

ccteam-cost.workspace = true

anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
notify = { workspace = true }
regex = { workspace = true }
# V0.8 W6 — hook_sink frames a typed `HookEvent` as length-prefixed
# JSON over the ccteam-owned hook.sock (Option C).
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

libc = "0.2"

# v0.9.0 W3 — `ccteam-exec.v1` frame type (`tungstenite::Message`) shared by
# the daemon-side bridge plumbing and the satellite exec engine. Same version
# pin as ccteam-cli/ccteam-web/ccteam-im (`connect` + `handshake` features).
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# Reverse-connection host channel: `ExecBridge::into_io` adapts an mpsc
# half to the `Sink<Message>` shape via `PollSender` (`sync` feature).
tokio-util = "0.7"
# Dial-back nonce mint (`host_channel::mint_nonce`) — same CSPRNG line
# `ccteam-core::session_secret` uses (core depends on harness, so the
# helper cannot be shared downward).
getrandom = { workspace = true }

# v0.8.9 — `capture(with_ansi=false)` renders the raw byte backlog
# through a vt100 state machine to plain text (consuming mouse / alt-screen
# / color / cursor sequences) so `peek` never leaks control codes to the
# user's terminal. Same version ccteam-core's screenshot pipeline pins.
vt100 = "0.15"

# W2b — the refcounted `tmux pipe-pane` FIFO relay ported out of
# `ccteam-web::pty` needs `mkfifo` + a 0600 `Mode`. `fs` is the only
# feature required.
nix = { version = "0.29", default-features = false, features = ["fs"] }

[dev-dependencies]
ccteam-core.workspace = true
# Bring tokio test runtime helpers into the smoke test. The workspace
# tokio feature set already includes `macros` / `rt-multi-thread` via
# `["full"]` — but NOT `test-util`, which the W4 merger tests need for
# `tokio::time::{pause, advance}` (deterministic GRACE_MS testing with
# no real sleeps). Enable it here as an additive dev-only feature.
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
serial_test = "3"
# v0.9.0 W3 — `remote_exec` unit test spins an in-process axum `GET /ws/echo`
# to verify the WS↔AsyncRead/AsyncWrite bridge over a real loopback socket.
axum = { workspace = true, features = ["ws"] }
