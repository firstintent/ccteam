# qa-autoloop — 4-stage QA automation workflow (planner / tester / fixer / releaser)
#
# A reusable ccteam workflow template for projects that want
# "find-bug → fix-bug → ship-bug-fix" automation without supervision.
# Originally extracted from the dex-ui autoloop (which itself was migrated
# from a cron-driven harness). All project specifics live in
# `.ccteam/config.json`; the agent prompts read that file rather than
# hardcoding values, so the same workflow + agents can be dropped into
# any project after editing one JSON file.
#
# ============================================================================
# ⚠️  Activation note — orchestrator does NOT hot-reload workflow.yaml
# ============================================================================
# The ccteam daemon reads workflow.yaml ONCE per project when it spawns the
# event loop (`run_project` in `crates/ccteam-core/src/orchestrator.rs`)
# and never re-reads it. Changes to triggers / watch paths take effect
# ONLY on next `ccteam start`.
#
# Re-enable procedure after editing this file:
#   1. `ccteam stop && ccteam start`  — at user discretion; do NOT issue
#      from a session managed by this same project (kills self).
#   2. Verify the daemon log shows three `watch registered` lines:
#        watch registered slug="<project>" role="tester"
#          watch="<...>/.ccteam/triggers/tester/"
#        watch registered slug="<project>" role="fixer"
#          watch="<...>/.ccteam/triggers/fixer/"
#        watch registered slug="<project>" role="releaser"
#          watch="<...>/.ccteam/triggers/releaser/"
# ============================================================================
#
# === Self-trigger fix (don't break this) ===
# Earlier revisions of this loop had each agent watching the same dir it
# *mutated* (status updates, comments). notify emits Modify on every jq
# rewrite → infinite self-excitation. Live observation in the predecessor
# loop: 45 successful runs + 80 stale-spawn errors over 4 h, burst rate
# climbing from 1/min to 8/min.
#
# Fix: split **tracking artifacts** (unwatched, agents freely mutate)
# from **trigger markers** (watched, write-once tiny JSON). Agents that
# want to wake a downstream peer drop a marker file into the peer's
# watched dir; no agent ever writes into its own watched dir.
#
#   tracking dir         trigger marker dir
#   ──────────────       ───────────────────────────────
#   .ccteam/backlog/  ←  .ccteam/triggers/tester/   (watched by tester)
#   .ccteam/issues/   ←  .ccteam/triggers/fixer/    (watched by fixer)
#   .ccteam/prs/      ←  .ccteam/triggers/releaser/ (watched by releaser)
#
# Markers are archived to `.ccteam/triggers.archived/<role>/` after read.
#
# === Triggers ===
#   planner   manual                            run periodically (e.g.
#                                               `ccteam spawn <slug> planner`)
#                                               or when backlog pending < 10.
#   tester    watch:.ccteam/triggers/tester/    written by planner / releaser
#                                               / human to wake the tester;
#                                               one session per marker.
#   fixer     watch:.ccteam/triggers/fixer/     written by tester when filing
#                                               a P1/P2 issue; one session
#                                               per marker. parallelism=2.
#   releaser  watch:.ccteam/triggers/releaser/  written by fixer when a PR
#                                               opens; one session per marker.

name: qa-autoloop
description: |
  Self-driving QA loop. planner → tester (file bugs) → fixer (open PRs)
  → releaser (review/merge/deploy/verify). All orchestration state in
  `.ccteam/`; GitHub PRs (or whatever review surface `config.json::review`
  declares) stay as the human-visible review channel.

  Watcher fires on dedicated marker dirs (`.ccteam/triggers/<role>/`) —
  agents NEVER write into their own watched dir, so the loop cannot
  self-excite.

agents:
  planner:
    executor: claude
    trigger: manual
    parallelism: 1

  tester:
    executor: claude
    trigger: watch:.ccteam/triggers/tester/
    parallelism: 1

  fixer:
    executor: claude
    trigger: watch:.ccteam/triggers/fixer/
    parallelism: 2

  releaser:
    executor: claude
    trigger: watch:.ccteam/triggers/releaser/
    parallelism: 1
