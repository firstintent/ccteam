[package]
name = "ccteam-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ccteam orchestrator core: state machine, protocol types, tmux wrapper, hook schemas."

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
dirs.workspace = true
notify.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
regex.workspace = true
thiserror.workspace = true

# V0.4.0 F63 — workflow.yaml parser. IndexMap preserves agent declaration
# order from YAML so trigger graph build / log output / fixture round-trips
# remain deterministic. serde feature so AgentSpec can derive Deserialize on
# `agents: IndexMap<String, AgentSpec>` directly. Already present transitively
# (serde_yaml → indexmap v2.x) so this only promotes it to a direct dep with
# the serde feature opt-in.
indexmap = { version = "2", features = ["serde"] }

# V0.4.0 F61 — `libc::kill(pid, SIGTERM)` for ClaudeCodeAdapter's
# shutdown_session path. Replaces the V0.3.1 tmux `kill-session`
# flow now that ClaudeCodeAdapter no longer owns a tmux session.
libc = "0.2"

# V0.2.2 F38 — terminal screenshot pipeline (vt100 + imageproc DIY).
# All four crates are pure Rust; no system C deps (libfontconfig /
# libfreetype). See `docs/v0-2-2/prd.md` §7 for the full rationale.
vt100 = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"

[dev-dependencies]
tempfile = "3"

# V0.4.0 F62 — codex-tests serialises tmux-touching integration tests
# so concurrent CodexAdapter spawn/shutdown checks don't race on the
# shared `tmux` server. Pinned to the same major as ccteam-web's
# dev-dependency for cargo dedup.
serial_test = "3"

[features]
default = []
# V0.4.0 F62 — gates CodexAdapter integration tests
# (`crates/ccteam-core/tests/codex_adapter_test.rs`). The tests require
# `tmux` on PATH and exercise the real `codex` CLI when present.
# Default feature set excludes them so CI without those binaries still
# passes; opt in with `cargo test --features codex-tests`.
codex-tests = []
