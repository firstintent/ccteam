name: product-research
description: Product research team — should we build this idea?

# V0.2 M0.17.2: phase_dir is now relative to the team directory
# (~/.ccteam/teams/<name>/). Default `phases` matches the new layout.
# Legacy yamls with `phase_dir: phases-product-research` are rewritten
# to `phases` on load via TeamSpec::load (warn-only).
phase_dir: phases

# V0.2 §6.4 candidate 2 — auto-managed `<project>/CLAUDE.md` body.
# `{slug}` and `{team}` get substituted at bootstrap time. Replaces
# the prior `match team { "product-research" => ... }` branch in
# projects::render_project_claude_md.
claude_md_template: |
  # CLAUDE.md (auto-managed by ccteam)

  ## 项目上下文
  - slug: {slug}
  - team: product-research
  - 用户原始需求: 见 .ccteam/spec.md

  ## 工作约定
  - 不写代码,只产研究报告。
  - 至少 3 个独立信息源,**不要编造数据**;不确定时标 "未确认"。
  - 决策走 outbox(`async` 模式)或 AskUserQuestion,**不要**自行假设关键事实。

  ## 不做的事
  - 不要修改 .ccteam/ 之外的元数据。
  - 不要在 verdict 之前下定论 — 让 phase DAG 走完。
  - 不要把 dev 的 "测试不过不算完成" 套用到本项目;研究报告的 done 是 verdict.md 写出 + rationale.md 自洽。

# Phase that produces a verdict markdown (interfaces §5.3 schema).
# `verdict.md` PASS/CONCERN/REJECT/CLARIFY drives downstream decisions.
verdict_schema:
  - verdict

# Team-specific ESCALATE prefixes the Stop hook should treat as known
# grammar (interfaces §4.1.1). Prefix is team semantics; route is one
# of the three built-in kinds (revert_to_phase / need_user_input / abort).
escalate_grammar_extensions:
  - prefix: MARKET_DUPLICATE
    route: abort
    reason: "target market saturated — the idea duplicates an existing free / widely-used tool, no further research needed"
  - prefix: INSUFFICIENT_VALIDATION
    route: need_user_input
    reason: "could not collect enough validation data within the round budget; user needs to supply more or accept best-effort"
  - prefix: LOW_DIFFERENTIATION
    route: revert_to_phase
    target_phase: kickoff
    reason: "no sustainable differentiation found; revert to kickoff so the user can rethink the brief from a different angle"

# Team-wide golden_rules default. Phase YAML's golden_rules takes
# priority — phases declaring their own ignore these. Empty for now;
# product-research has no team-wide hard quality bars (each phase
# declares its own where applicable).
golden_rules: []

# Critic dimensions — data form only in M3; M5 will read these.
# Empty here per the plan §5 M3 design notes (4.2): research / dev
# both leave critic_dimensions empty until M5 wires the Critic loop.
critic_dimensions: []

# Retro fields the M4.1 retro phase emits per product-research project
# (REJECT branch only — PASS / CONCERN hand off to dev without producing a
# product-research-side retro entry; the dev project's own retro covers it).
retro_schema:
  - field: market_signals
    description: Top market signals collected (demand, saturation, pricing)
  - field: differentiation_findings
    description: Unique angles found / ruled out
  - field: feasibility_assessment
    description: Tech / business feasibility verdict
  - field: verdict_rationale
    description: Why this verdict (PASS / CONCERN / REJECT / CLARIFY)
