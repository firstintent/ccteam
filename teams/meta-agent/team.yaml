name: meta-agent
description: User-facing NL dispatcher session. Long-running event loop; V0.5.0 F101 — lightweight router + cross-project memory bridge + dashboard chat.

# Evergreen session — meta-agent runs as one long tmux session.
# `process_meta_project` (inbox drain + context reset) dispatches it
# rather than any pipeline / DAG loop.
evergreen: true

# Cost is the user's running tab here, not a per-project budget —
# the soft / mid / hard ladder doesn't apply. `none` skips cost
# tracking entirely.
cost_policy:
  kind: none

# Directory declared for schema completeness even though meta-agent
# ships nothing here. `load_team_runtimes` treats `evergreen: true`
# as exempt from the must-exist check; the dir name is relative to
# the team directory (`~/.ccteam/teams/meta-agent/`).
phase_dir: phases

# Auto-managed CLAUDE.md template — body lives in
# `crates/ccteam-core/src/templates/meta_agent_role.md` so the
# meta-agent's role prompt stays the SoT for the session's CLAUDE.md.
# Leaving `claude_md_template` empty keeps `bootstrap_meta_project`
# the owner of the CLAUDE.md write path (renders the role prompt
# instead of using the team's template).
claude_md_template: ""

# V0.5.0 F101: meta-agent is now a router/memory-bridge/dashboard
# session, not a pipeline. retro / critic / escalate-grammar / verdict
# schemas are empty and the V0.2 `forbid_ask_user_question` golden
# rule was dropped — the new role prompt (`meta_agent_role.md`)
# documents inbox/outbox semantics directly, no rule injection
# needed.
retro_schema: []
critic_dimensions: []
escalate_grammar_extensions: []
verdict_schema: []
golden_rules:
  protocol: []
  domain: []
