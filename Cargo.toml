[workspace]
resolver = "2"
members = [
    "crates/ccteam-core",
    "crates/ccteam-cost",
    "crates/ccteam-cli",
    "crates/ccteam-hooks",
    # V0.6.0 Wave 2 F109/F116 — IM-bot daemon + supervisor.
    # V0.6.1 F130: library-only (binary folded into `ccteam start`).
    "crates/ccteam-im",
    "crates/ccteam-flow",
    # V0.8 W0 spike — future home of the `ProcessBackend` trait + `RmuxBackend`
    # impl. Currently a placeholder pinning `rmux-sdk` 0.3 so the
    # workspace catches any rmux semver drift via `rmux_types_compile_link`
    # and a `#[ignore]` end-to-end smoke test. Real trait surface lands W1.
    "crates/ccteam-harness",
    "crates/ccteam-web",
]

[workspace.package]
version = "0.10.5"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
ccteam-core = { path = "crates/ccteam-core" }
ccteam-cost = { path = "crates/ccteam-cost" }
ccteam-hooks = { path = "crates/ccteam-hooks" }
ccteam-im = { path = "crates/ccteam-im" }
ccteam-flow = { path = "crates/ccteam-flow" }
ccteam-harness = { path = "crates/ccteam-harness" }
ccteam-web = { path = "crates/ccteam-web" }

# rmux — the unified-mux execution surface (tmux-compatible daemon SDK).
# Pinned at the 0.5 minor (crates.io v0.5.0). The byte-faithful web
# terminal uses `PaneOutputStream`/`PaneOutputChunk::Bytes` (present since
# 0.3.1; 0.5 adds window-creation APIs + tmux-compat/terminal-event fixes).
# Internal crates (rmux-pty / rmux-ipc / rmux-os / rmux-types) flow in
# transitively — do NOT add them as direct deps. `ratatui-rmux` is
# intentionally NOT pulled (ccteam owns its own TUI rendering, if any).
rmux-sdk = "0.5"
rmux-client = "0.5"
rmux-server = "0.5"
rmux-proto = "0.5"

tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
# V0.6.3 F142 — standard 5-field cron parsing for `trigger: schedule`
# agents. `croner` is maintained (3.x), lightweight, and depends only
# on `chrono` (already a workspace dep) + build-time derive macros.
croner = "3"
# tg-6955 — display-cell width (CJK wide = 2) for the IM picker button
# labels: width-based trim + tail padding so Telegram's centre-aligned
# button text reads left-aligned. Already in the graph transitively
# (0.1.14); pinning the same minor adds no new crate.
unicode-width = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
# V0.3.1 F46 — harness adapter error types (HarnessError) use thiserror
# derive so `&'static str` payloads on `NotImplemented` stay alloc-free
# and the variant set is exhaustive without per-call format!() boilerplate.
thiserror = "1"

# V0.6.0 F107 — async trait methods on HarnessAdapter (5-method
# thread/turn shape). `async fn` in traits requires `async-trait`
# crate until Rust's native AFIT stabilizes object-safety + dyn use.
async-trait = "0.1"
# V0.6.0 F107 — `BoxStream<'static, ThreadEvent>` return for the
# events() trait method.
futures = { version = "0.3", default-features = false, features = ["std"] }

# Lark/Feishu WebSocket long-connection frame codec (pbbp2.proto).
# The `derive` feature is on by default and powers `#[derive(prost::Message)]`
# on the hand-written `PbFrame` / `PbHeader` structs — no `prost-build`,
# no codegen, no vendored `.proto`. Only consumed by ccteam-im behind the
# `lark` feature.
prost = "0.14"

# V0.3 M5.0 — web UI (axum + askama). Pinned per `docs/versions/v0-3/prd.md`
# §3.2.2; minor bumps in M5.x must update the table there.
axum = "0.8"
askama = "0.12"
# Constant-time token comparison for M5.3 token auth. Pulled in at
# M5.0 so `ServeOpts::token_file` can carry the knob without dep
# manifest churn when the auth middleware actually lands.
subtle = "2.5"
# v0.8.7 review-fix (R-M1) — OS CSPRNG for the per-session cto-gate secret
# (`ccteam_core::session_secret::mint`). Already in the tree transitively
# via `rand 0.8`; pinned at 0.2 (the widely-vendored line) and consumed
# directly so the secret never relies on a weak time-only token.
getrandom = "0.2"
# v0.8.9 Phase 2 — sha256 integrity check on ccteam-hub plugin bodies.
# `ccteam_im::hub::fetch_plugin_body` verifies `sha256(body) ==
# plugin.content_sha` before writing, so a tampered/MITM'd hub body is
# refused (`HubError::ShaMismatch`) rather than written into the project.
# Already in the tree transitively via `rust-embed-utils` (ccteam-web);
# pinned at the 0.10 line and consumed directly here.
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
# HTTP client used by ccteam-web integration tests (lib + subprocess).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# v0.8.7 W5 (Item E) — OpenAPI auto-docs for the `/api/v1` resource API.
# `utoipa` 5.x derives `ToSchema` / `#[utoipa::path]`; `utoipa-axum`
# 0.2.x is the axum-0.8 binding (the 0.1.x line pinned axum 0.7 and will
# not compile here) and provides `OpenApiRouter` so the spec is generated
# from the same route registrations (single source of truth, anti-drift);
# `utoipa-scalar` 0.3.x serves the Scalar interactive UI. The `axum`
# feature on utoipa(-extras) wires the `Path`/`Query`/`Json` extractors
# into the derive; `chrono` teaches the schema layer about `DateTime`.
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

# Dev builds are debuginfo-dominated: a single debug binary is ~90% DWARF and
# every integration-test file links its own copy, so `target/debug` balloons.
# Trim it so the tree stays lean and links faster WITHOUT losing day-to-day
# debuggability:
#   - own crates keep file:line in panics/backtraces (line-tables-only);
#   - dependencies carry no debuginfo (we never step into tokio/serde/…);
#   - split-debuginfo keeps DWARF out of the binary file itself (Linux).
# Need to step into one dependency? add `[profile.dev.package.<dep>] debug = true`.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
