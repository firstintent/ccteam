[package]
name = "ccteam-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ccteam command-line tool: orchestrator daemon, project management, and hook subcommands."

[[bin]]
name = "ccteam"
path = "src/main.rs"

[dependencies]
ccteam-core.workspace = true
ccteam-hooks.workspace = true
ccteam-web.workspace = true
clap.workspace = true
chrono.workspace = true
dirs.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

# V0.4.0-hotfix — `prctl(PR_SET_PDEATHSIG, SIGTERM)` so mcp-serve
# self-terminates when its parent (Claude Code MCP client) goes
# away. Without this, idle stdin doesn't surface EOF and the process
# accumulates. Linux-only; the wrapper is `#[cfg(target_os = "linux")]`
# no-op elsewhere.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
