# ccteam workflow.yaml — Pocket Assistant preset (V0.6.0 Wave 2 F114).
#
# Single chat bot bound to one IM channel (DM). User sends `/start`
# or any message to the bot in TG / Slack / Discord; daemon spawns
# a session, replies via the IM bridge, persists turn history under
# `.ccteam/chat/<bot>/turns.jsonl`.
#
# Schema: `mode: chat` is V0.6.0 Wave 2 (tui-impl task #2). Field
# names below match the agreed shape; defaults may change before
# the wave commits.
#
# Generated by ccteam-creator (preset: chat-pocket).
# Persona: {{persona_label}}
# Bot handle: {{bot_handle}}
# IM platform: {{im_platform}}
name: {{workflow_slug}}
description: |
  Pocket Assistant — single bot DM on {{im_platform}}. Long-running
  chat session with last-N turn replay on session loss.

mode: chat

chat:
  bot_name: {{bot_handle}}
  im_platform: {{im_platform}}
  compact_every_turns: 20
  hop_limit: 1
  recover_last_n_turns: 8
  chat_acl:
    - {{owner_chat_id}}

budget:
  max_cost_usd_per_24h: 5.00

agents:
  {{primary_role}}:
    trigger: manual
    max_parallel: 1
