# GitHub Actions: tag-triggered prebuilt-binary release (F166 + F174).
#
# Pushing a tag like `v0.6.7` builds the `ccteam` binary on four targets,
# packages each with a per-asset SHA-256 sum, aggregates a single
# SHA256SUMS file, and uploads everything to the corresponding GitHub
# Release. `install.sh` (repo root) reads these assets — keep the asset
# naming `ccteam-<tag>-<suffix>.<ext>` and the suffix vocabulary
# (linux-x64 / linux-arm64 / macos-arm64 / macos-x64) in lockstep with
# that script.
#
# F174: linux binaries are statically linked against musl libc
# (x86_64-unknown-linux-musl / aarch64-unknown-linux-musl) so they run
# on any Linux distro regardless of host glibc version. Pre-F174
# releases targeted `x86_64-unknown-linux-gnu` on `ubuntu-latest`
# (glibc 2.39 from Ubuntu 24.04) which broke installs on Ubuntu 22.04,
# Debian 12, and NAS-class systems pinned to older glibc. Suffix names
# stay `linux-x64` / `linux-arm64` (musl is transparent to users); the
# static-link sanity step at the end of the build job guards against
# silent regressions if a dep upgrade re-introduces a glibc dependency.
#
# Windows is intentionally out of scope: ccteam builds on POSIX —
# signals (`libc::SIGKILL` / `SIGTERM` in
# `crates/ccteam-core/src/harness.rs`), unix domain sockets, and
# filesystem watches. Windows users run ccteam under WSL2 with the
# linux-x64 binary. (tmux is NOT among these: it belongs to the frozen
# `terminal` protocol, and the default stream-json / ACP path needs no
# PTY at all.)
#
# The repo-guard on every job stops a fork that accidentally inherits
# this workflow from publishing under the upstream release page.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.suffix }}
    if: github.repository == 'firstintent/ccteam'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: linux-x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            suffix: linux-arm64
            ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-arm64
            ext: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: macos-x64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install musl toolchain (linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Pre-install the SPA `node_modules/` before `cargo build` so the
      # `ccteam-web` build.rs (which feature-gates on `web-bundle`,
      # default-on) finds them and skips its own `npm install`. We split
      # by runner OS+arch because `package-lock.json` is generated on
      # Linux x64 and only resolves the linux-x64 rolldown native
      # binding; macOS and linux-arm64 `npm ci` would honor that
      # lockfile and skip the platform-specific `optionalDependencies`,
      # leaving rolldown unable to load its native node binding at build
      # time. Clearing the lockfile on those runners forces a fresh
      # platform-correct resolution.
      - name: Pre-install web SPA deps (linux x64 fast path with lockfile)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        working-directory: crates/ccteam-web/web
        run: npm ci --no-audit --no-fund --include=optional

      - name: Pre-install web SPA deps (macOS / linux-arm64 — drop lockfile for native binding refresh)
        if: runner.os == 'macOS' || (runner.os == 'Linux' && runner.arch == 'ARM64')
        working-directory: crates/ccteam-web/web
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund --include=optional

      - name: Build ccteam binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin ccteam

      # Static-link sanity (linux only). musl target should produce a
      # binary with no dynamic dependencies; if a dep ever pulls in a
      # glibc-linked native lib (rare but possible after dep bumps),
      # `file` will report `dynamically linked` and we fail the build
      # before shipping a broken binary to users.
      - name: Verify static linkage (linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          BIN="target/${{ matrix.target }}/release/ccteam"
          file "$BIN"
          if ! file "$BIN" | grep -qE 'statically linked|static-pie linked'; then
            echo "::error::ccteam binary is not statically linked — musl target regressed."
            exit 1
          fi

      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          PKG="ccteam-${TAG}-${{ matrix.suffix }}"
          STAGE="$(mktemp -d)/${PKG}"
          mkdir -p "${STAGE}"
          cp "target/${{ matrix.target }}/release/ccteam" "${STAGE}/ccteam"
          cp README.md LICENSE "${STAGE}/"
          tar -czf "${PKG}.tar.gz" -C "$(dirname "${STAGE}")" "${PKG}"
          # Per-asset checksum (also rolled up later into SHA256SUMS).
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          else
            shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccteam-${{ matrix.suffix }}
          path: |
            ccteam-*-${{ matrix.suffix }}.tar.gz
            ccteam-*-${{ matrix.suffix }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish-release
    needs: build
    if: github.repository == 'firstintent/ccteam'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate SHA256SUMS
        shell: bash
        run: |
          set -eu
          cd dist
          # Each per-asset .sha256 already contains `<hash>  <basename>`.
          # Concatenate them so `sha256sum -c SHA256SUMS` validates the
          # whole release in one shot.
          : > SHA256SUMS
          for f in *.sha256; do
            cat "$f" >> SHA256SUMS
          done
          ls -la

      - name: Write release notes
        shell: bash
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          cat > release-notes.md <<EOF
          # ccteam ${TAG}

          Prebuilt binaries for Linux (x86_64 + aarch64, statically
          linked against musl libc so they run on any glibc version) and
          macOS (Intel + Apple Silicon). No runtime dependencies: no Rust
          toolchain, no Node, no tmux. Windows users: run ccteam under
          WSL2 with the linux-x64 binary (ccteam builds on POSIX signals,
          unix sockets and filesystem watches).

          ## Install (one prebuilt binary, ~14 MB)

          Nothing to compile and no toolchain to install — each archive below
          holds a single self-contained \`ccteam\` executable.

          \`\`\`sh
          curl -sSL https://raw.githubusercontent.com/firstintent/ccteam/main/install.sh | sh
          \`\`\`

          Or download the archive for your platform below and extract \`ccteam\`
          into a directory on your \`PATH\` (e.g. \`~/.local/bin\`).

          ## Verify

          \`\`\`sh
          sha256sum -c SHA256SUMS   # linux
          shasum -a 256 -c SHA256SUMS   # macOS
          \`\`\`

          ## macOS Gatekeeper

          The macOS binaries are not notarized. After download:

          \`\`\`sh
          xattr -d com.apple.quarantine ccteam
          \`\`\`

          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          cd dist
          # A pre-release-shaped tag (contains a hyphen, e.g. v0.9.7-rc1) is
          # published as a GitHub pre-release: it is EXCLUDED from
          # /releases/latest, so install.sh and `ccteam update` (both read
          # /latest) never serve it to users — it is installable only via an
          # explicit CCTEAM_VERSION=<tag> pin, for hand-testing before the
          # final tag. A plain vX.Y.Z tag stays the "latest" release.
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          # Only ship the user-facing archives + the aggregated SHA256SUMS;
          # the per-asset .sha256 files are intermediate.
          # Idempotent: a release may already exist for this tag (e.g. someone
          # cut it by hand before the build finished). Creating it again is a
          # 422 that used to fail the whole job and leave the release with NO
          # binaries. Upload into the existing release instead.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              ccteam-*.tar.gz SHA256SUMS
          else
            gh release create "${TAG}" ${PRERELEASE} \
              --repo "${GITHUB_REPOSITORY}" \
              --title "ccteam ${TAG}" \
              --notes-file ../release-notes.md \
              ccteam-*.tar.gz SHA256SUMS
          fi

  # npm channel (PRD v0.10.5 D2 / PLUG-5): the same four binaries ride into
  # `@ccteam/engine-<os>-<cpu>` platform packages, and `@ccteam/ccteam-ui`
  # (the DSH plugin) pins them as optionalDependencies at the SAME version,
  # so `dsh plugin --profile <name> add @ccteam/ccteam-ui` brings an engine with it and
  # `ccteam update --channel npm` has something to install from. Runs only
  # after the GitHub release succeeded, and only when the repository secret
  # `NPM_TOKEN` (publish rights on the `@ccteam` org) is set — without it the
  # job explains itself in the run summary and skips, never fails the tag.
  npm:
    name: publish-npm
    needs: [build, release]
    if: github.repository == 'firstintent/ccteam'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate on NPM_TOKEN
        id: gate
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "${NPM_TOKEN}" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            {
              echo "## npm publish skipped"
              echo "Repository secret \`NPM_TOKEN\` is not set (it needs publish rights on the \`@ccteam\` npm org)."
              echo "The GitHub release above is complete; \`dsh plugin --profile <name> add @ccteam/ccteam-ui\` will not see this version until the packages are published."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up Node
        if: steps.gate.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish engine platform packages
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # A pre-release-shaped tag lands under the `next` dist-tag so
          # `latest` (what a bare `dsh plugin add` resolves) stays clean.
          DIST_TAG=latest
          case "$TAG" in *-*) DIST_TAG=next ;; esac
          mkdir -p out
          # release asset suffix -> npm platform tuple (`os`/`cpu` of the template)
          for pair in linux-x64:linux-x64 linux-arm64:linux-arm64 macos-arm64:darwin-arm64 macos-x64:darwin-x64; do
            suffix="${pair%%:*}"
            tuple="${pair##*:}"
            archive="dist/ccteam-${TAG}-${suffix}.tar.gz"
            [ -f "$archive" ] || { echo "::error::missing release asset ${archive}"; exit 1; }
            work="$(mktemp -d)"
            tar -xzf "$archive" -C "$work"
            bin="${work}/ccteam-${TAG}-${suffix}/ccteam"
            [ -x "$bin" ] || { echo "::error::no executable ccteam inside ${archive}"; exit 1; }
            tgz="$(plugins/engine-packages/pack-engine.sh "$tuple" "$bin" "$VERSION" out | head -n1)"
            pkg="@ccteam/engine-${tuple}"
            # Idempotent: re-running the tag must not fail on an already-published version.
            if npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
              echo "${pkg}@${VERSION} already on the registry; skipping"
            else
              npm publish "$tgz" --access public --tag "$DIST_TAG"
            fi
          done

      - name: Publish @ccteam/ccteam-ui
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DIST_TAG=latest
          case "$TAG" in *-*) DIST_TAG=next ;; esac
          cd plugins/ccteam-ui
          # The engine packages are optional deps and are not needed to build the plugin.
          npm ci --omit=optional
          npm run build
          # Stamp the tag onto a copy of the manifest: package version, the four
          # optionalDependencies, and `ccteam.engine` (the pinned engine version the
          # plugin's supervisor enforces) all equal the tag — pre-1.0 lockstep (D5).
          node -e '
            const fs = require("node:fs")
            const v = process.argv[1]
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
            pkg.version = v
            for (const k of Object.keys(pkg.optionalDependencies || {})) pkg.optionalDependencies[k] = v
            pkg.ccteam = { ...(pkg.ccteam || {}), engine: v }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")
          ' "$VERSION"
          if npm view "@ccteam/ccteam-ui@${VERSION}" version >/dev/null 2>&1; then
            echo "@ccteam/ccteam-ui@${VERSION} already on the registry; skipping"
          else
            npm publish --access public --tag "$DIST_TAG"
          fi
          {
            echo "## npm"
            echo "Published \`@ccteam/ccteam-ui@${VERSION}\` (dist-tag \`${DIST_TAG}\`) with \`@ccteam/engine-{linux-x64,linux-arm64,darwin-x64,darwin-arm64}@${VERSION}\`."
            echo "Install: \`dsh plugin --profile <name> add @ccteam/ccteam-ui\` (DSH requires the profile flag)"
          } >> "$GITHUB_STEP_SUMMARY"
