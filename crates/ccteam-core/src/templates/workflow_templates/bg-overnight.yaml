# ccteam workflow.yaml — Overnight Builder preset (V0.6.0 Wave 2 F114).
#
# Long-running background workflow driven by ArtifactWatcher. User
# closes the laptop; the daemon keeps fix-loop / qa-loop / monitor
# alive via `claude --bg` spawns triggered by artifact files dropping
# in `.ccteam/inbox/<agent>/`.
#
# Generated by ccteam-creator (preset: bg-overnight).
# Persona: {{persona_label}}
name: {{workflow_slug}}
description: |
  Overnight Builder — artifact-driven QA fix-loop running unattended.
  Triggers: planner → executor → critic → planner (loop until done).

mode: artifact-driven

budget:
  max_cost_usd_per_24h: 10.00

agents:
  planner:
    trigger: manual
    max_parallel: 1
{{scope_yaml}}
  executor:
    trigger: watch:.ccteam/inbox/executor
    max_parallel: 1
{{scope_yaml}}
  critic:
    trigger: watch:.ccteam/inbox/critic
    max_parallel: 1
{{scope_yaml}}
