# OpenAI rate sheet — dollars per 1M tokens.
#
# Source: openai.com/api/pricing. The gpt-5.x family (current Codex
# models — gpt-5.5 default / gpt-5.4 / gpt-5.4-mini) verified 2026-06-24,
# cross-checked across two independent pricing mirrors. The legacy
# o3 / o3-mini / gpt-4o / gpt-4o-mini rows are retained for any older
# usage (verified 2026-05).
#
# Reasoning tokens (hidden CoT) are billed at the standard output rate,
# so `reasoning_per_1m == output_per_1m` for the reasoning models
# (gpt-5.x, o3, o3-mini). The gpt-4o family is not a reasoning model —
# `reasoning_per_1m` is omitted.
#
# Cached input discount (prompt cache hit): gpt-5.x cache_read is 10% of
# input ($0.50 / $0.25 / $0.075 for 5.5 / 5.4 / 5.4-mini); o3 75% off;
# o3-mini / gpt-4o / gpt-4o-mini 50% off.
#
# No fallback_model: an unknown / new Codex model id — e.g.
# gpt-5.3-codex-spark, which has no public price — prices to `None`
# (shown as "—", excluded from sums) rather than being billed at some
# other model's rate. Add the model here to price it.

